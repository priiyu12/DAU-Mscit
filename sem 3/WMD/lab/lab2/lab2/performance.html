<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books Collection (Performance Optimized)</title>
<style>
  body { font-family: sans-serif; background-color: #faf7f2; color: #333; margin: 0; padding: 0; }
  h1 { text-align: center; margin-top: 40px; }
  .gallery { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 20px; 
    justify-content: center; 
    padding: 20px; 
    max-width: 1200px;
    margin: 0 auto;
  }
  .gallery img { 
    width: 300px; 
    height: 450px; 
    object-fit: cover; 
    border-radius: 8px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .video-container { 
    text-align: center; 
    margin: 40px auto; 
    max-width: 800px;
  }
</style>
</head>
<body>

<h1>Our Book Collection</h1>

<div class="gallery">
  <!-- Lazy loaded images using compressed placeholders to simulate optimization -->
  <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=300&q=80" loading="lazy" alt="Book 1">
  <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=300&q=80" loading="lazy" alt="Book 2">
  <img src="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&w=300&q=80" loading="lazy" alt="Book 3">
  <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=300&q=80" loading="lazy" alt="Book 4">
</div>

<div class="video-container">
  <h2>Featured Video</h2>
  <!-- Lazy loaded video iframe -->
  <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" loading="lazy" allowfullscreen></iframe>
</div>

</body>
</html>
